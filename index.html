<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positioning</title>
    <style>
        /*digite aqui o seu codigo css*/
        .circulo-vermelho{
            background-color: rgb(0, 255, 0);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
            left: 250px;
            top: 150px;
        }
        .caixa-azul{
            background-color: rgb(204, 0, 255);
            width: 500px;
            height: 300px;
            position: absolute;
            left: 200px;
            top: 200px;
        }
    </style>
</head>
<body>
   <div class="caixa-azul">
     <div class="circulo-vermelho">

        </div>
     </div> 
</body>
</html>
